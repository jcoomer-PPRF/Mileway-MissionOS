name: Verify
on:
  pull_request:
  push:
    branches: [main, 'codex/**', claude/hardening-0011]
permissions:
  contents: read
jobs:
  build-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:md01
      - run: npm run build:md02
      - run: npm run build:md02:staging
      - run: node scripts/verify-md01-build.mjs
      - run: node scripts/verify-md02-build.mjs
      - run: node scripts/verify-md02-staging-build.mjs
      - run: node --test tests/md02-staging-config.test.mjs
      - run: bash supabase/tests/run.sh mileway_ci_test
      - run: bash supabase/tests/upgrade.sh
      - run: sh supabase/tests/runner_guard.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:md01:built
  md02-persistence:
    # The pilot intentionally rejects TCP/hosted targets. Use a private Unix socket
    # on macOS instead of relaxing those guards to fit the existing Docker job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: brew install postgresql@17
      - run: npx playwright install chromium
      - name: Verify fresh fictional persistence, review, authorization and restore
        run: npm run verify:md02:release
        env:
          MD02_PG_BIN: /opt/homebrew/opt/postgresql@17/bin
      - name: Upload only synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md02-fictional-verification
          path: /private/tmp/missionos-md02-d-*-evidence/
          retention-days: 7
          if-no-files-found: warn
